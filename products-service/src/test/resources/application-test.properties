spring.datasource.url=jdbc:h2:mem:products_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

products.security.jwt.jwks-url=http://127.0.0.1:65535/.well-known/jwks.json
products.security.jwt.jwks-cache-ttl=5m
products.security.jwt.issuer=itcommerce-users
products.security.jwt.audience=itcommerce-api

products.images.s3.bucket=
products.images.s3.region=
products.images.presign-ttl=15m
products.images.stub-base-url=https://stub-upload.test

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
