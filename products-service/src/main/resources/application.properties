spring.application.name=products-service

server.port=${PORT:8080}

spring.datasource.url=${PRODUCTS_DB_URL}
spring.datasource.username=${PRODUCTS_DB_USER}
spring.datasource.password=${PRODUCTS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

products.security.jwt.jwks-url=${PRODUCTS_JWKS_URL:http://users-service:8000/.well-known/jwks.json}
products.security.jwt.jwks-cache-ttl=${PRODUCTS_JWKS_CACHE_TTL:5m}
products.security.jwt.issuer=${PRODUCTS_JWT_ISSUER:itcommerce-users}
products.security.jwt.audience=${PRODUCTS_JWT_AUDIENCE:itcommerce-api}

products.images.s3.bucket=${PRODUCTS_S3_BUCKET:}
products.images.s3.region=${PRODUCTS_S3_REGION:}
products.images.presign-ttl=${PRODUCTS_S3_PRESIGN_TTL:15m}
products.images.stub-base-url=${PRODUCTS_IMAGE_STUB_BASE_URL:https://stub-upload.local}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
